services:
  - type: web
    name: sistema-de-incidencias-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-incidencias-db
          property: connectionString

databases:
  - name: sistema-incidencias-db
    databaseName: incidentes
    user: incidentes_user
    plan: free